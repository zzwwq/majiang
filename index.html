<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="53NjDAjORwtPVGcTKBV2RG">
<head data-page-node-id="G8SzPTkUfyhnno6V7N8v7I">
    <meta charset="UTF-8" data-page-node-id="QkNfygqy1l0uC0U8BzVtzd">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" data-page-node-id="lnbW9fZlsJy1730Pe0z9WU">
    <title>浦城麻将 - 单机人机对战</title>
    <style>
        :root {
            --bg-color: #050d08;
            --table-felt: #114b2d;
            --table-felt-inner: #0d3a22;
            --table-border: #1c110a;
            --tile-bg: linear-gradient(180deg, #ffffff 0%, #f4efe2 80%, #dfd3bd 100%);
            --tile-back-green: linear-gradient(180deg, #27ae60 0%, #1e824c 100%);
            --accent-gold: #f39c12;
            --danger-red: #e74c3c;
            --btn-blue: #3498db;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Kaiti SC", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #app {
            width: 100vw;
            height: 100vh;
            max-width: 1366px;
            max-height: 850px;
            background-color: #071910;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }

        .header {
            height: 46px;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            font-size: 14px;
            z-index: 30;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .header-title {
            font-weight: bold;
            font-size: 16px;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select, button {
            background: #1c3024;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        select:hover, button:hover {
            background: #2a4736;
            border-color: var(--accent-gold);
        }

        .btn-gold {
            background: linear-gradient(180deg, #f39c12, #d35400);
            color: #fff;
            font-weight: bold;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        .btn-gold:hover {
            background: linear-gradient(180deg, #f1c40f, #e67e22);
        }

        .mahjong-table {
            flex: 1;
            background: radial-gradient(circle at center, var(--table-felt) 0%, var(--table-felt-inner) 75%, #061c10 100%);
            border: 12px solid var(--table-border);
            position: relative;
            display: grid;
            grid-template-rows: 68px minmax(0, 1fr) 160px;
            grid-template-columns: 110px minmax(0, 1fr) 110px;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }

        .player-area {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            min-width: 0;
            overflow: hidden;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 25;
            transition: border-color 0.3s, box-shadow 0.3s;
            position: relative;
            cursor: pointer;
        }
        .player-info.active {
            border-color: var(--accent-gold);
            box-shadow: 0 0 12px var(--accent-gold);
        }
        .player-score {
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 11px;
        }

        .dealer-badge {
            background: #e74c3c;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 3px;
            margin-left: 4px;
            border: 1px solid #f1c40f;
            display: inline-block;
        }

        /* 需求1: 南北头像移到左侧，让手牌行有更多纵向空间 */
        .area-north { grid-row: 1; grid-column: 2; flex-direction: row; justify-content: center; align-items: center; gap: 8px; padding: 4px 10px 0; }
        .area-north > .player-info { flex-shrink: 0; }
        .area-north > div:last-child { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* 需求2: 东西家碰杠与手牌墙分区，碰杠多了换行不挤手牌 */
        .area-west { grid-row: 2; grid-column: 1; flex-direction: column; justify-content: center; align-items: center; gap: 8px; overflow: hidden; }
        .area-east { grid-row: 2; grid-column: 3; flex-direction: column; justify-content: center; align-items: center; gap: 8px; overflow: hidden; }
        .area-west > .player-info, .area-east > .player-info { flex-shrink: 0; }
        .area-west .melds-container, .area-east .melds-container { flex-shrink: 0; max-height: 120px; overflow: hidden; flex-wrap: wrap; align-content: flex-start; justify-content: center; }
        .area-west .side-tile-wall, .area-east .side-tile-wall { flex: 1 1 auto; min-height: 30px; overflow: hidden; align-content: flex-start; }
        /* 东西两侧碰/杠牌：缩小牌面让杠牌(4张)整行放下列宽内，多组碰杠竖向换行完整显示 */
        .area-west .meld-group, .area-east .meld-group { padding: 1px; gap: 1px; }
        .area-west .meld-group .tile.small, .area-east .meld-group .tile.small { width: 24px; height: 32px; border-radius: 3px; }
        .area-west .meld-group .tile.small .tile-num, .area-east .meld-group .tile.small .tile-num { font-size: 12px; line-height: 1; }
        .area-west .meld-group .tile.small .tile-char, .area-east .meld-group .tile.small .tile-char { font-size: 9px; line-height: 1; }

        .area-south { grid-row: 3; grid-column: 1 / span 3; flex-direction: column; justify-content: flex-end; align-items: center; padding: 0 8px 6px; z-index: 20; position: relative; }
        .area-south > .player-info { position: absolute; left: 10px; bottom: 8px; z-index: 26; }

        .area-center {
            grid-row: 2;
            grid-column: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .center-board {
            width: 210px;
            min-height: 135px;
            max-height: 100%;
            overflow: hidden;
            padding: 8px;
            background: #092416;
            border-radius: 10px;
            border: 3px solid #1a6e3d;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.7), inset 0 0 10px rgba(0,0,0,0.6);
            z-index: 20;
            text-align: center;
        }

        .turn-indicator {
            font-size: 14px;
            font-weight: bold;
            color: #2ecc71;
        }

        .action-announcement {
            color: #f1c40f;
            font-size: 13px;
            font-weight: bold;
            background: rgba(0,0,0,0.85);
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid var(--accent-gold);
            display: none;
            width: 100%;
            word-break: break-all;
            animation: pulse 1s infinite alternate;
        }

        .discards-grid {
            position: absolute;
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            z-index: 15;
            max-width: 320px;
        }
        
        .discards-north { top: 8px; left: 50%; transform: translateX(-50%); justify-content: center; }
        .discards-south { bottom: 8px; left: 50%; transform: translateX(-50%); justify-content: center; }
        .discards-west { left: 24px; top: 50%; transform: translateY(-50%); justify-content: flex-start; max-width: 220px; }
        .discards-east { right: 24px; top: 50%; transform: translateY(-50%); justify-content: flex-end; max-width: 220px; }

        .melds-container { display: flex; gap: 4px; z-index: 22; flex-wrap: wrap; }
        .side-melds { display: flex; flex-direction: row; flex-wrap: wrap; gap: 3px; max-height: 56px; align-content: flex-start; justify-content: center; }

        .meld-group {
            display: flex;
            gap: 1px;
            background: rgba(0,0,0,0.4);
            padding: 2px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tile.angang-back {
            background: var(--tile-back-green) !important;
            border: 1px solid #145a32 !important;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5) !important;
        }
        .tile.angang-back .tile-num, .tile.angang-back .tile-char { display: none !important; }

        .tile {
            background: var(--tile-bg);
            border-radius: 5px;
            border: 1px solid #a88f5f;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,1), inset 0 -3px 5px rgba(120,90,40,0.25);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            position: relative;
            cursor: pointer;
            transition: transform 0.15s ease, margin 0.15s ease, box-shadow 0.15s ease;
        }

        .tile.back-top {
            width: clamp(30px, 3.2vw, 38px);
            height: clamp(42px, 4.5vw, 52px);
            background: var(--tile-back-green);
            border: 1px solid #145a32;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
        }

        .side-tile-wall { display: flex; flex-direction: column; gap: 1px; }
        .side-tile {
            width: clamp(18px, 2vw, 24px);
            height: clamp(24px, 2.5vw, 31px);
            background: linear-gradient(90deg, #1e824c 0%, #27ae60 70%, #145a32 100%);
            border: 1px solid #0d381e;
            border-radius: 3px;
            box-shadow: -2px 1px 4px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .tile[data-suit="wan"] .tile-num, .tile[data-suit="wan"] .tile-char { color: #d32f2f; }
        .tile[data-suit="tong"] .tile-num, .tile[data-suit="tong"] .tile-char { color: #1565c0; }
        .tile[data-suit="tiao"] .tile-num, .tile[data-suit="tiao"] .tile-char { color: #1b8d50; }
        .tile[data-suit="zhong"] .tile-num { color: #c62828; font-size: 30px; }

        .tile.small { width: clamp(26px, 2.9vw, 32px); height: clamp(36px, 4vw, 44px); border-radius: 4px; }
        .tile.small .tile-num { font-size: clamp(13px, 1.5vw, 17px); line-height: 1; }
        .tile.small .tile-char { font-size: clamp(9px, 1vw, 12px); line-height: 1; }

        .hand-tiles { display: flex; gap: 4px; align-items: flex-end; padding: 4px 8px; }

        .area-south .hand-tiles .tile {
            width: clamp(50px, 5.5vw, 62px);
            height: clamp(74px, 8vw, 90px);
            border-radius: 6px;
            border-bottom: 6px solid #1e824c;
            box-shadow: 0 8px 16px rgba(0,0,0,0.7), inset 0 2px 0 rgba(255,255,255,1), inset 0 -4px 6px rgba(120,90,40,0.3);
        }

        .area-south .hand-tiles .tile .tile-num {
            font-size: clamp(26px, 2.9vw, 34px);
            font-family: "Kaiti SC", "STKaiti", "楷体", serif;
            font-weight: 900;
            line-height: 1;
        }
        .area-south .hand-tiles .tile .tile-char {
            font-size: clamp(15px, 1.7vw, 19px);
            font-family: "Kaiti SC", "STKaiti", "楷体", serif;
            font-weight: 900;
            line-height: 1;
            margin-top: 3px;
        }

        .area-south .hand-tiles .tile.selected {
            transform: translateY(-20px);
            border-color: var(--accent-gold);
            box-shadow: 0 10px 18px rgba(0,0,0,0.6), 0 0 10px var(--accent-gold);
        }

        .drawn-tile-gap { margin-left: 16px !important; }
        .side-drawn-tile-gap { margin-top: 10px !important; }

        .action-bar {
            position: absolute;
            bottom: 145px;
            right: 28px;
            display: flex;
            gap: 12px;
            z-index: 35;
        }

        .action-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f39c12, #d35400);
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            border: 2px solid #fff;
            box-shadow: 0 5px 14px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .action-btn:active { transform: scale(0.92); }
        .action-btn.pass { background: linear-gradient(135deg, #7f8c8d, #34495e); }
        .action-btn.hu { background: linear-gradient(135deg, #e74c3c, #c0392b); font-size: 17px; animation: pulse 1s infinite alternate; }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: #12261b;
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            width: 92%;
            max-width: 560px;
            padding: 20px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-header {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-gold);
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding-bottom: 8px;
        }

        .modal-body { font-size: 13px; line-height: 1.6; max-height: 420px; overflow-y: auto; }
        .settle-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,0.1); }

        .log-item {
            background: rgba(0,0,0,0.3);
            border-left: 3px solid var(--accent-gold);
            padding: 8px 10px;
            margin-bottom: 10px;
            border-radius: 0 6px 6px 0;
        }

        /* ===== 手机自适应：用 vmin/vw 让桌面与手牌按视口缩放，不再被固定 px 卡住 ===== */
        @media (max-width: 768px) {
            #app { max-width: 100%; max-height: 100%; }
            .header { height: 38px; padding: 0 8px; font-size: 12px; }
            .header-title { font-size: 13px; gap: 4px; }
            .controls-group { gap: 6px; }
            select, button { font-size: 11px; padding: 3px 6px; }

            /* 行列用 vmin：横竖屏都按短边比例缩放，避免固定 px 在小屏挤压截断 */
            .mahjong-table {
                grid-template-rows: minmax(66px, 17vmin) minmax(0, 1fr) minmax(112px, 25vmin);
                grid-template-columns: minmax(44px, 11vmin) minmax(0, 1fr) minmax(44px, 11vmin);
                border-width: 6px;
            }
            .center-board { width: min(46vmin, 240px); min-height: min(30vmin, 130px); padding: 6px; gap: 3px; }
            .turn-indicator { font-size: 12px; }
            .action-announcement { font-size: 11px; padding: 3px 6px; }

            /* 手牌：用 vw 自适应宽度，竖屏 14 张也能横排放下 */
            .hand-tiles { gap: 2px; padding: 2px 4px; }
            .area-south .hand-tiles .tile {
                width: clamp(22px, 6.2vw, 44px);
                height: clamp(34px, 9.4vw, 66px);
                border-bottom-width: 4px;
            }
            .area-south .hand-tiles .tile .tile-num { font-size: clamp(13px, 3vw, 22px); }
            .area-south .hand-tiles .tile .tile-char { font-size: clamp(8px, 1.6vw, 12px); margin-top: 1px; }
            .area-south .hand-tiles .tile.selected { transform: translateY(-14px); }
            .drawn-tile-gap { margin-left: 10px !important; }

            .action-bar { bottom: min(118px, 26vmin); right: 8px; gap: 8px; }
            .action-btn { width: 44px; height: 44px; font-size: 12px; }
            .action-btn.hu { font-size: 14px; }

            .discards-grid { max-width: min(40vmin, 280px); }
            .player-info { font-size: 10px; padding: 3px 6px; gap: 4px; }
            .player-score { font-size: 10px; }
            .dealer-badge { font-size: 9px; }
            .side-tile { width: 16px; height: 22px; }
            .tile.back-top { width: 22px; height: 30px; }
            .tile.small { width: 20px; height: 27px; }
            .tile.small .tile-num { font-size: 10px; }
            .tile.small .tile-char { font-size: 8px; }
            .area-west .melds-container, .area-east .melds-container { max-height: 96px; }
            .area-west .meld-group .tile.small, .area-east .meld-group .tile.small { width: 18px; height: 24px; }
            .area-west .meld-group .tile.small .tile-num, .area-east .meld-group .tile.small .tile-num { font-size: 10px; }
            .area-west .meld-group .tile.small .tile-char, .area-east .meld-group .tile.small .tile-char { font-size: 7px; }
            .area-west .player-info, .area-east .player-info { padding: 2px 4px; gap: 3px; }
            .area-west .player-info .avatar, .area-east .player-info .avatar { width: 20px; height: 20px; font-size: 11px; }
            .modal-card { width: 94%; padding: 14px; }
            .modal-header { font-size: 15px; }
            .modal-body { font-size: 12px; max-height: 60vh; }
        }

        /* ===== 横屏矮屏（手机横屏：宽度可能 >768 但高度矮）=====
           按短边 vmin 自适应，保证整桌完整可见；iPad/桌面(高度>560)不受影响 */
        @media (orientation: landscape) and (max-height: 560px) {
            #app { max-width: 100%; max-height: 100%; }
            .header { height: 36px; padding: 0 8px; font-size: 12px; }
            .header-title { font-size: 13px; gap: 4px; }
            .controls-group { gap: 6px; }
            select, button { font-size: 11px; padding: 3px 6px; }

            .mahjong-table {
                grid-template-rows: minmax(66px, 17vmin) minmax(0, 1fr) minmax(102px, 25vmin);
                grid-template-columns: minmax(70px, 14vmin) minmax(0, 1fr) minmax(70px, 14vmin);
                border-width: 6px;
            }
            .center-board { width: min(46vmin, 220px); min-height: min(27vmin, 104px); padding: 5px; gap: 3px; }
            .turn-indicator { font-size: 11px; }
            .action-announcement { font-size: 10px; padding: 3px 6px; }

            .hand-tiles { gap: 2px; padding: 2px 4px; }
            .area-south .hand-tiles .tile {
                width: clamp(20px, 6vw, 40px);
                height: clamp(30px, 9vw, 60px);
                border-bottom-width: 4px;
            }
            .area-south .hand-tiles .tile .tile-num { font-size: clamp(12px, 2.8vw, 20px); }
            .area-south .hand-tiles .tile .tile-char { font-size: clamp(8px, 1.5vw, 11px); margin-top: 1px; }
            .area-south .hand-tiles .tile.selected { transform: translateY(-12px); }
            .drawn-tile-gap { margin-left: 10px !important; }

            .action-bar { bottom: min(106px, 24vmin); right: 8px; gap: 8px; }
            .action-btn { width: 42px; height: 42px; font-size: 12px; }
            .action-btn.hu { font-size: 14px; }

            .discards-grid { max-width: min(40vmin, 140px); }
            .player-info { font-size: 10px; padding: 3px 6px; gap: 4px; }
            .player-score { font-size: 10px; }
            .dealer-badge { font-size: 9px; }
            .side-tile { width: 14px; height: 18px; }
            .tile.back-top { width: 21px; height: 29px; }
            .tile.small { width: 19px; height: 26px; }
            .tile.small .tile-num { font-size: 10px; }
            .tile.small .tile-char { font-size: 8px; }
            .area-west .melds-container, .area-east .melds-container { max-height: 80px; }
            .area-west .meld-group .tile.small, .area-east .meld-group .tile.small { width: 15px; height: 18px; border-radius: 2px; }
            .area-west .meld-group .tile.small .tile-num, .area-east .meld-group .tile.small .tile-num { font-size: 9px; }
            .area-west .meld-group .tile.small .tile-char, .area-east .meld-group .tile.small .tile-char { font-size: 6px; }
            /* 手机横屏：东西头像只留头像圆点，隐藏名字/积分文字，释放纵向空间给手牌墙 */
            .area-west .player-info, .area-east .player-info { padding: 2px; gap: 0; flex-direction: column; align-items: center; background: rgba(0,0,0,0.55); }
            .area-west .player-info > div:not(.avatar), .area-east .player-info > div:not(.avatar) { display: none; }
            .area-west .player-info .avatar, .area-east .player-info .avatar { width: 20px; height: 20px; font-size: 11px; border-width: 1px; }
            .modal-card { width: 94%; padding: 12px; }
            .modal-header { font-size: 15px; }
